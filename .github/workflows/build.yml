name: Build HandyBadge Remote

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: dotnet build src/HandyBadgeRemote.csproj -c Release -o out

      - name: Tidy output
        shell: pwsh
        run: |
          Get-ChildItem out -Include *.pdb,*.xml -Recurse | Remove-Item
          Get-ChildItem out | Format-Table Name, Length

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: HandyBadgeRemote
          path: out/*

      - name: Zip for release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: Compress-Archive -Path out/* -DestinationPath "HandyBadgeRemote-${{ github.ref_name }}.zip"

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: HandyBadgeRemote-${{ github.ref_name }}.zip
